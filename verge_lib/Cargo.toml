[package]
name = "verge"
version = "0.0.0-2026-05-16"
edition = "2024"
license = "MIT"
description = "Verge Library: Sound specifications and lemmas for Verus"
keywords = ["verus", "verified-rust", "verification"]
categories = ["development-tools"]

[lib]
name = "verge"
path = "verge.rs"

[dependencies]
vstd = "0.0.0-2026-05-31-0205"
verus_builtin = "0.0.0-2026-05-17-0151"
verus_builtin_macros = "0.0.0-2026-05-31-0205"
verge_macros = { path = "../verge_macros" }
paste = "1.0.15"

[package.metadata.verus]
verify = true